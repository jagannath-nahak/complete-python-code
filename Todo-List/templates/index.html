<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <div class="container">
        <h1>List of tasks:</h1>
    <form action="/add" method="post">
        <input type="text" name="item" placeholder="Enter a task you want to add">
        <button type="submit" style="background-color: yellow; color:blue" >Add</button>
    </form>
    <ul>
        {% for item in tasks %}
            <li>
                {{ item }}
                <form action="{{ url_for('delete', index=loop.index0) }}" method="post" style="display:inline;">
                    <button type="submit" style="color: red;" style="background-color: black;">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    </div>
</body>
</html>
